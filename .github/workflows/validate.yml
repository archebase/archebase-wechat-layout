name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate canonical CSS
        run: python3 scripts/validate_inkpost_css.py assets/archebase-wechat-safe.css
      - name: Validate Python scripts
        run: python3 -m py_compile scripts/*.py
      - name: Validate evals
        run: python3 -m json.tool evals/evals.json >/dev/null
